<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Brand Purple & Bright Violet Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120B1F" />
      <stop offset="100%" stop-color="#09070D" />
    </linearGradient>

    <linearGradient id="monogram-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120B1F" />
      <stop offset="35%" stop-color="#D675FF" />
      <stop offset="70%" stop-color="#C44DFF" />
      <stop offset="100%" stop-color="#9400D3" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C44DFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9400D3" stop-opacity="0.3" />
    </linearGradient>

    <!-- Subtle Glow Filter for Monogram Peak -->
    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    :root {
      color-scheme: light dark;
    }
    .am-path {
      fill: url(#monogram-grad);
    }

    /* Light Theme Browser Support */
    @media (prefers-color-scheme: light) {
      .bg-box {
        fill: #0F091A;
        stroke: #9400D3;
        stroke-width: 3px;
      }
    }
  </style>
<!-- Clean Precision AM Interlocking Monogram Path -->
  <!-- 'A' left leg & crossbar blending seamlessly into 'M' double peaks -->
  <path class="am-path" filter="url(#purple-glow)" d="
    M 14 46
    L 23 18
    L 28.5 18
    L 34.5 35
    L 40.5 18
    L 46 18
    L 50 46
    L 43.5 46
    L 41 27.5
    L 35.5 44
    L 31.5 44
    L 26 27.5
    L 23.5 46
    Z
    M 21.2 36
    H 28
    L 26.5 31
    H 22.7
    Z
  " />
</svg>